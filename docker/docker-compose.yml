# Entorno "Docker" para desarrollo y pruebas de la integración directa
# Alejandría <-> Oracle iMES — es UNA de las 3 opciones parametrizables
# (Productivo / Pruebas / Docker) en appsettings.json de Alejandría.
#
# Usa la imagen gvenzl/oracle-xe (gratuita, sin necesidad de cuenta
# Oracle ni aceptar licencia para bajarla) en vez de la imagen oficial de
# Oracle, que si requiere cuenta y aceptar términos en el Container
# Registry de Oracle.
#
# Arrancar:   docker compose up -d
# Ver logs:   docker compose logs -f oracle-imes-test
# Apagar:     docker compose down          (conserva los datos)
# Apagar y borrar todo: docker compose down -v
#
# La primera vez tarda varios minutos (Oracle XE inicializa la base
# desde cero) — los scripts en ./init se corren automáticamente esa
# primera vez, creando el usuario IMES, la secuencia, y las 3 tablas.

services:
  oracle-imes-test:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: alejandria-oracle-test
    ports:
      # 1521 = igual que el puerto real de Oracle, para que la cadena de
      # conexión del entorno "Docker" en Alejandría sea casi idéntica a
      # la de Pruebas/Productivo (solo cambia el host).
      - "1521:1521"
    environment:
      # Contraseña del usuario SYS/SYSTEM — no es la del usuario IMES
      # (esa se crea en 01_create_user.sql con su propia contraseña).
      ORACLE_PASSWORD: "DevOnly_ChangeMe!"
      APP_USER: IMES
      APP_USER_PASSWORD: "DevOnly_ChangeMe!"
    volumes:
      # Los .sql de aquí se corren en orden, una sola vez, la primera vez
      # que se crea el volumen (no en cada "docker compose up").
      - ./init:/container-entrypoint-initdb.d
      - oracle-imes-test-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  oracle-imes-test-data:
